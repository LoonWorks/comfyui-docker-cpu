
# A workflow that builds the CPU-only ComfyUI Docker image and publishes it to the GitHub Container Registry
name: Build & Publish ComfyUI

# Triggers on semver tag pushes (e.g. v1.2.3)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:

  # Builds the CPU-only ComfyUI Docker image and publishes it to the GitHub Container Registry
  build-and-publish:

    runs-on: ubuntu-latest

    # contents:read to checkout, packages:write to push to GHCR, attestations:write + id-token:write for provenance attestation
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:

      # Checks out the repository so that subsequent steps can access the Dockerfile and build context
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Extracts dependency versions from Dockerfile ARG defaults; these are passed as build args so the workflow
      # stays in sync automatically whenever the Dockerfile versions are updated
      - name: Extract Versions from Dockerfile
        id: versions
        run: |
          COMFYUI_VERSION=$(grep -oP '(?<=ARG COMFYUI_VERSION=)\S+' source/Dockerfile)
          COMFYUI_MANAGER_VERSION=$(grep -oP '(?<=ARG COMFYUI_MANAGER_VERSION=)\S+' source/Dockerfile)
          PYTORCH_VERSION=$(grep -oP '(?<=ARG PYTORCH_VERSION=)\S+' source/Dockerfile)
          if [[ -z "$COMFYUI_VERSION" || -z "$COMFYUI_MANAGER_VERSION" || -z "$PYTORCH_VERSION" ]]; then
            echo "ERROR: One or more version variables could not be extracted from source/Dockerfile" >&2
            exit 1
          fi
          echo "comfyui_version=$COMFYUI_VERSION" >> "$GITHUB_OUTPUT"
          echo "comfyui_manager_version=$COMFYUI_MANAGER_VERSION" >> "$GITHUB_OUTPUT"
          echo "pytorch_version=$PYTORCH_VERSION" >> "$GITHUB_OUTPUT"

      # Logs in to GHCR using the triggering actor's GitHub token.
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates image name, tags, and OCI labels from git metadata.
      # Tags produced (single CPU-only variant, latest always set):
      #   sha-<short>
      #   <major>                                                          (skipped for v0.x)
      #   <major>.<minor>
      #   <version>
      #   <version>-comfyui-<COMFYUI_VERSION>
      #   <version>-comfyui-<COMFYUI_VERSION>-pytorch-<PYTORCH_VERSION>
      - name: Create Tags & Labels for the Docker Image
        id: docker-image-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('ghcr.io/{0}', github.repository) }}
          flavor: |
            latest=true
          tags: |
            type=sha
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=semver,pattern={{version}}-comfyui-${{ steps.versions.outputs.comfyui_version }}
            type=semver,pattern={{version}}-comfyui-${{ steps.versions.outputs.comfyui_version }}-pytorch-${{ steps.versions.outputs.pytorch_version }}
          labels: |
            org.opencontainers.image.title=ComfyUI Docker (CPU)
            org.opencontainers.image.authors=LoonWorks

      # Builds the CPU-only ComfyUI image and pushes it to GHCR
      - name: Build and Push the Docker Image
        id: build-and-push-docker-image
        uses: docker/build-push-action@v6
        with:
          context: source
          push: true
          build-args: |
            COMFYUI_VERSION=${{ steps.versions.outputs.comfyui_version }}
            COMFYUI_MANAGER_VERSION=${{ steps.versions.outputs.comfyui_manager_version }}
            PYTORCH_VERSION=${{ steps.versions.outputs.pytorch_version }}
          tags: ${{ steps.docker-image-metadata.outputs.tags }}
          labels: ${{ steps.docker-image-metadata.outputs.labels }}

      # Generates an unforgeable build-provenance attestation for supply-chain security.
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ format('ghcr.io/{0}', github.repository) }}
          subject-digest: ${{ steps.build-and-push-docker-image.outputs.digest }}
          push-to-registry: true
